name: Deploy Minechat

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minechat-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy commit over SSH
        shell: bash
        env:
          DEPLOY_HOST: '84.201.180.177'
          DEPLOY_USER: marik
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'DEPLOY_SSH_KEY is not configured.' >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'DEPLOY_KNOWN_HOSTS is not configured.' >&2; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/minechat-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_SHA"
